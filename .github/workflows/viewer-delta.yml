name: Viewer minimal publication

on:
  pull_request:
    paths:
      - 'p24_foundation/**'
      - 'tests/test_viewer_minimal*'
      - 'tests/test_viewer_scoped_inputs.py'
      - 'tests/test_viewer_web_existing.py'
      - 'tests/test_viewer_lan_access.py'
      - 'AnomalyDetection/**'
      - 'viewer_performance/**'
      - 'Start_Viewer*.cmd'
      - 'tools/viewer.ps1'
      - 'tests/test_viewer_launcher_bytes.py'
      - 'tests/test_viewer_process_control.py'
      - 'tests/test_viewer_origin_storage.py'
      - 'tests/test_viewer_web_budget.py'
      - 'tests/test_viewer_web_control.py'
      - '.gitattributes'
      - 'RELEASE_MANIFEST.json'
      - '.github/workflows/viewer-delta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ephemeral-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Fresh observation boundaries and monotonic timing
        run: python -B -m unittest -v AnomalyDetection.validation.test_observe_viewer_live
      - name: Equivalent projections, late arrivals and native crash recovery
        env:
          P24_DELTA_PG_HOST: 127.0.0.1
          P24_DELTA_PG_PORT: '5432'
          P24_DELTA_PG_USER: postgres
          PGPASSWORD: ephemeral-test-only
        run: >-
          python -B -m unittest -v
          tests.test_viewer_minimal_publication
          tests.test_viewer_minimal_pg
          tests.test_viewer_scoped_inputs
          tests.test_viewer_web_existing
          tests.test_viewer_lan_access
          tests.test_viewer_launcher_bytes
          tests.test_viewer_process_control
          tests.test_viewer_online
          tests.test_viewer_scoped_fetch
          tests.test_viewer_finalized_projection
          tests.test_viewer_final_semantic_index
          tests.test_viewer_storage_keys_pg
          tests.test_viewer_origin_storage
          tests.test_viewer_web_budget
          tests.test_viewer_web_control
          tests.test_viewer_direct_web
      - name: AD compatibility and unit regressions
        working-directory: AnomalyDetection
        env:
          P24_DELTA_PG_HOST: 127.0.0.1
          P24_DELTA_PG_PORT: '5432'
          P24_DELTA_PG_USER: postgres
          PGPASSWORD: ephemeral-test-only
        run: python -B -m unittest discover -s tests -q
  windows-launchers:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Fresh observation boundaries and monotonic timing
        run: python -B -m unittest -v AnomalyDetection.validation.test_observe_viewer_live
      - name: Recheck byte preservation with Windows Git conversion enabled
        run: git -c core.autocrlf=true -c core.eol=crlf checkout -- Start_Viewer.cmd Start_Viewer_Standard.cmd tools/viewer.ps1
      - name: Exact bytes and real Windows process handles
        run: python -B -m unittest -v tests.test_viewer_launcher_bytes tests.test_viewer_process_control tests.test_viewer_web_existing tests.test_viewer_lan_access tests.test_viewer_direct_web tests.test_viewer_origin_storage tests.test_viewer_web_budget tests.test_viewer_web_control
