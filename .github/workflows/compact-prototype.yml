name: Compact behavior prototype
on:
  pull_request:
    paths:
      - 'compact_behavior/**'
      - 'tests/test_compact*'
      - '.github/workflows/compact-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v tests.test_compact_extract tests.test_compact_trial
      - run: python -c "from compact_behavior.version import verify; print(verify())"
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable-compact-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Real COPY, late data, concurrency and process crash
        env:
          P24_DELTA_PG_HOST: 127.0.0.1
          P24_DELTA_PG_PORT: '5432'
          P24_DELTA_PG_USER: postgres
          PGPASSWORD: disposable-compact-test
        run: python -B -m unittest -v tests.test_compact_extract tests.test_compact_pg tests.test_compact_trial
