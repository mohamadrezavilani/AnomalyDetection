name: UserID architecture contracts
on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'docs/userid/**'
      - 'tests/test_userid_contracts.py'
      - 'AGENTS.md'
      - 'README.md'
      - 'Pishkhan24_Project_Roadmap.md'
      - '.github/workflows/userid-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'docs/userid/**'
      - 'tests/test_userid_contracts.py'
      - '.github/workflows/userid-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated conformance and legacy regression dependencies
        run: python -m pip install jsonschema==4.25.1 -r requirements-compact.txt
      - name: Validate contract examples and invariants
        run: python -B -m unittest -v tests.test_userid_contracts
      - name: Validate documented example command
        run: python -B -m contracts.userid.validate
      - name: Check preserved legacy extraction and content behavior
        run: python -B -m unittest -v tests.test_compact_extract tests.test_compact_features_v2 tests.test_compact_context tests.test_compact_request_context
      - name: Verify unchanged legacy runtime manifest
        run: python -B -m compact_product version
