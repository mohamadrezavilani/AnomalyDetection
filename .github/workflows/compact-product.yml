name: Compact behavior product
on:
  pull_request:
    paths:
      - 'compact_behavior/**'
      - 'compact_ad/**'
      - 'compact_product/**'
      - 'tests/test_compact*'
      - 'tools/*Compact*.py'
      - 'requirements-compact.txt'
      - '.github/workflows/compact-product.yml'
  push:
    branches: [main]
    paths:
      - 'compact_behavior/**'
      - 'compact_ad/**'
      - 'compact_product/**'
      - 'tests/test_compact*'
      - 'tools/*Compact*.py'
      - '.github/workflows/compact-product.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-compact.txt
      - run: python -B -m unittest -v tests.test_compact_audit36 tests.test_compact_audit35 tests.test_compact_security tests.test_compact_extract tests.test_compact_features_v2 tests.test_compact_ad tests.test_compact_ad_adaptive tests.test_compact_longitudinal tests.test_compact_trial tests.test_compact_web_presentation tests.test_compact_error_catalog tests.test_compact_request_context tests.test_compact_context tests.test_compact_context_upgrade tests.test_compact_nullable_content tests.test_compact_history_task_repair tests.test_compact_operations tests.test_compact_history tests.test_compact_source_evidence
      - run: python -B -m compact_product version
      - name: Parse native PowerShell entry
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          Get-ChildItem compact_product -Filter *.ps1 | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){$errors | Format-List; throw 'PowerShell parse failed'}
            Get-Command $_.FullName -Syntax
          }
  postgres-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable-compact-test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-compact.txt playwright==1.62.0
      - name: Fetch immutable accepted v5 code for live-writer compatibility
        run: git fetch --no-tags --depth=1 origin 018a75f817c1c141c03712b50f7477dd6d32e537
      - name: PostgreSQL, three processes, crash recovery and actual browser
        env:
          P24_DELTA_PG_HOST: 127.0.0.1
          P24_DELTA_PG_PORT: '5432'
          P24_DELTA_PG_USER: postgres
          PGPASSWORD: disposable-compact-test
          P24_COMPACT_UI_SCREENSHOTS: compact-ui-screenshots
        run: |
          export P24_COMPACT_BROWSER=$(command -v google-chrome)
          test -n "$P24_COMPACT_BROWSER"
          python -B -m unittest -v tests.test_compact_audit36 tests.test_compact_audit35 tests.test_compact_security_pg tests.test_compact_pg tests.test_compact_product_pg tests.test_compact_product_runtime tests.test_compact_history_pg tests.test_compact_longitudinal tests.test_compact_ui_browser
      - name: Compare indexed metadata write path with installed build 16
        env:
          P24_DELTA_PG_HOST: 127.0.0.1
          P24_DELTA_PG_PORT: '5432'
          P24_DELTA_PG_USER: postgres
          PGPASSWORD: disposable-compact-test
        run: |
          git fetch --no-tags --depth=1 origin c4f5ccd72b642a267a97843b4dc9ed66957c7c74
          git worktree add --detach /tmp/compact-installed-16 c4f5ccd72b642a267a97843b4dc9ed66957c7c74
          python tools/Benchmark_Compact_Context.py --baseline /tmp/compact-installed-16 --candidate . --output compact-ui-screenshots/context-benchmark.json
      - name: Bounded adaptive AD CPU and memory comparison
        run: |
          git fetch --no-tags --depth=1 origin 3c01de66f715a5af8c2d5b9e0aafa9717932c596
          git worktree add --detach /tmp/compact-ad-baseline-14 3c01de66f715a5af8c2d5b9e0aafa9717932c596
          python tools/Benchmark_Compact_AD.py --baseline /tmp/compact-ad-baseline-14 --candidate . --output compact-ui-screenshots/ad-benchmark.json
      - name: Bounded refusal cohort CPU and memory budget
        run: python -m tools.Benchmark_Compact_Security --output compact-ui-screenshots/security-benchmark.json
      - name: Upload synthetic UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-ui-synthetic
          path: compact-ui-screenshots/*
          if-no-files-found: ignore
