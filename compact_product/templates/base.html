<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title>
<style>body{font-family:Tahoma,Arial,sans-serif;background:#f6f7fa;color:#172438;margin:0;line-height:1.9}main{max-width:1200px;margin:auto;padding:24px}nav{display:flex;gap:24px;border-bottom:1px solid #ddd;padding-bottom:12px}a{color:#1759a5;text-decoration:none}a:hover{text-decoration:underline}h1{font-size:22px}h2{font-size:17px}.card{background:white;border:1px solid #e1e5ec;border-radius:8px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.label{font-size:13px;color:#5b6575}.number{font-size:20px;font-weight:bold}table{width:100%;border-collapse:collapse;background:white;font-size:13px}th,td{text-align:right;padding:10px;border-bottom:1px solid #eee;vertical-align:top}th{background:#edf1f7}code,.ltr{direction:ltr;unicode-bidi:embed;display:inline-block;overflow-wrap:anywhere}pre{direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;max-height:500px;overflow:auto;font-size:12px}input,textarea,select,button{font:inherit;padding:7px;border:1px solid #bac5d4;border-radius:4px}button{background:#1759a5;color:white;cursor:pointer}.warn{color:#9b4e00}.muted{color:#697386;font-size:13px}.scroll{overflow:auto}details{margin:10px 0}footer{font-size:11px;color:#788390;margin-top:25px}.status-ANOMALY{color:#a42424}.status-INVALID_INPUT,.status-INSUFFICIENT_DATA{color:#9b4e00}</style>
<main><nav><a href="/">رفتارها</a><a href="/incidents">آنومالی‌ها</a><a href="/status">وضعیت پردازش</a><a href="{{ request.full_path }}">تازه‌سازی دستی</a></nav><h1>{{ title }}</h1>{% block content %}{% endblock %}<footer>{{ build }} · اطلاعات فقط با تازه‌سازی دستی به‌روز می‌شوند.</footer></main></html>
