{% set filters=filters|default({}) %}
<section class="card"><form class="search-form" method="get" action="/">
<input type="hidden" name="scope" value="{{ scope }}">
<label>RequestID <input class="ltr" name="request_id" value="{{ filters.get('request_id','') }}" maxlength="512" autocomplete="off" spellcheck="false" placeholder="شناسهٔ کامل درخواست"></label>
<label>Session <input class="ltr" name="session_id" value="{{ filters.get('session_id','') }}" maxlength="512" autocomplete="off" spellcheck="false" placeholder="شناسهٔ کامل نشست"></label>
<label>IP <input class="ltr" name="ip" value="{{ filters.get('ip','') }}" maxlength="64" autocomplete="off" spellcheck="false" placeholder="IPv4 / IPv6"></label>
<label>از تاریخ و ساعت تهران <input class="ltr" type="datetime-local" step="1" name="from" value="{{ filters.get('from','') }}"></label>
<label>تا تاریخ و ساعت تهران <input class="ltr" type="datetime-local" step="1" name="to" value="{{ filters.get('to','') }}"></label>
<button>اعمال فیلتر</button><a href="/?scope={{ scope }}">پاک‌کردن فیلترها</a>
</form><p class="muted">بازه به وقت تهران است. جست‌وجوی IP بدون تاریخ، ۲۴ ساعت اخیر را نشان می‌دهد.</p></section>
